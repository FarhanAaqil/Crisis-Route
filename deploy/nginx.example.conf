# Example reverse proxy / load balancer in front of several CrisisRoute replicas.
# Replicas must share the state volume (CRISISROUTE_STATE_DIR) or run behind sticky sessions.
upstream crisisroute {
    least_conn;
    server crisisroute-1:8000;
    server crisisroute-2:8000;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name crisisroute.example.org;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # Hashed build assets are immutable, so a CDN can cache them for a year
    location /assets/ {
        proxy_pass http://crisisroute;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://crisisroute;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
