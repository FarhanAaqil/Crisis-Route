name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Ruff lint
        run: ruff check backend experiments

      - name: Ruff format
        run: ruff format --check backend experiments

      - name: Mypy
        run: mypy --config-file backend/pyproject.toml backend/app experiments

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Production build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t crisisroute:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name cr -p 8000:8000 \
            -e CRISISROUTE_ENVIRONMENT=development \
            -e CRISISROUTE_JWT_SECRET_KEY=ci-secret-ci-secret-ci-secret-ci-secret \
            crisisroute:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ | grep -qi "<div id=\"root\""

      - name: Container logs
        if: always()
        run: docker logs cr
