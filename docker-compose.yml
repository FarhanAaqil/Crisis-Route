version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: crisisroute-db
    environment:
      POSTGRES_DB: crisisroute
      POSTGRES_USER: crisisroute
      POSTGRES_PASSWORD: crisisroute_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crisisroute -d crisisroute"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crisisroute-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crisisroute:crisisroute_secure_password@db:5432/crisisroute
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:

