# One container serves the API and the web app on http://localhost:8000.
# Copy .env.example to .env and fill it in first (the stack refuses to start without a signing secret).

services:
  crisisroute:
    build:
      context: .
      dockerfile: Dockerfile
    image: crisisroute:latest
    container_name: crisisroute
    environment:
      CRISISROUTE_ENVIRONMENT: ${CRISISROUTE_ENVIRONMENT:-production}
      CRISISROUTE_JWT_SECRET_KEY: ${CRISISROUTE_JWT_SECRET_KEY:?Set CRISISROUTE_JWT_SECRET_KEY in .env (32+ characters)}
      CRISISROUTE_CORS_ORIGINS: ${CRISISROUTE_CORS_ORIGINS:-http://localhost:8000}
      CRISISROUTE_USERS_FILE: /run/secrets/crisisroute_users
    secrets:
      - crisisroute_users
    ports:
      - "8000:8000"
    volumes:
      - crisisroute-state:/var/lib/crisisroute
    restart: unless-stopped

secrets:
  crisisroute_users:
    file: ${CRISISROUTE_USERS_FILE_PATH:-./deploy/users.json}

volumes:
  crisisroute-state:
